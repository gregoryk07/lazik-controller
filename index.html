<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Łazik USB WebHID controller</title>
</head>
<body>
    <h1>WebHID usb controller (łazik)</h1>
    <script>
        if(!navigator.hid){
            document.write("<p>WebHID isn't available on this device!</p>")
        }
    </script>
    <button id="connectBtn">Connect</button>
    <button id="requestBtn" disabled>Request data</button>
    <p>Status: <span id="status">Disconnected</span></p>
    <p>Chunks/Packets Required to Receive Data: <span id="packetCount" style="font-weight: bold;">0</span></p>
    
    <h2>Received JSON:</h2>
    <pre id="jsonDisplay" style="background: #f4f4f4; padding: 10px; font-family: monospace;">--</pre>
    <button onclick="sendData('DUMPDIR')">Refresh logs directory</button>
    <ul id="remoteFiles"></ul>
    <script>
        let hidDevice = null;
        let receivedBuffer = "";
        let chunkCount = 0;

        const connectBtn = document.getElementById('connectBtn');
        const requestBtn = document.getElementById('requestBtn');
        const statusEl = document.getElementById('status');
        const packetCountEl = document.getElementById('packetCount');
        const jsonDisplay = document.getElementById('jsonDisplay');

        const VENDOR_ID = 0x1d6b; 
        const PRODUCT_ID = 0x0105;

        connectBtn.addEventListener('click', async () => {
            try {
                const devices = await navigator.hid.requestDevice({
                    filters: [{ vendorId: VENDOR_ID, productId: PRODUCT_ID }]
                    // filters: []
                });

                if (devices.length === 0) return;

                hidDevice = devices[0];
                await hidDevice.open();
                statusEl.textContent = `Connected to: ${hidDevice.productName}`;
                connectBtn.disabled = true;
                requestBtn.disabled = false;

                hidDevice.addEventListener('inputreport', (event) => {
                    const { data } = event;
                    const bytes = new Uint8Array(data.buffer);
                    const decoder = new TextDecoder();
                    const chunkString = decoder.decode(bytes).replace(/\0/g, '');
                    console.log(chunkString)
                    
                    // Increment chunk counter for each incoming report segment
                    chunkCount++;
                    packetCountEl.textContent = chunkCount;

                    receivedBuffer += chunkString;

                    // Reassemble and parse once the complete JSON object ends with '}'
                    if (receivedBuffer.includes('}')) {
                        try {
                            const jsonData = JSON.parse(receivedBuffer);
                            console.log(jsonData)
                            jsonDisplay.textContent = JSON.stringify(jsonData, null, 4);
                            if(jsonData.action == "dumpdir"){
                                document.getElementById("remoteFiles").innerHTML = ""
                                for (let i = 0; i < jsonData.files.length; i++) {
                                    const file = jsonData.files[i];
                                    console.log(file.name)
                                    document.getElementById("remoteFiles").innerHTML += "<li onclick=\"sendData('DUMPLOG " + file.name + "')\">" + file.name + " - " + file.size + " Bytes</li>"
                                }
                            }
                            if(jsonData.action == "dumplog"){
                                // console.warn("A")
                                let content = "<head><title>" + jsonData.name + "</title></head><body>" + jsonData.log.split("\n").join("<br>") + "</bo" + "dy>";
                                // let content = "AAA"
                                // console.log(jsonData.log.split("\n").join("<br>"))
                                // console.warn("Ab")
                                const b = new Blob([content], {
                                    type: "text/html",
                                });
                                // console.warn("Aa")
                                window.open(URL.createObjectURL(b), "popup", "popup")
                                // console.warn("Ac")
                            }
                            // Reset buffer for the next transaction
                            receivedBuffer = ""; 
                        } catch (e) {
                            // console.error(e)
                            // Keep accumulating if JSON is still incomplete
                        }
                    }
                    // console.log(receivedBuffer)
                });

                
            } catch (error) {
                console.error("Connection error:", error);
                statusEl.textContent = `Error: ${error.message}`;
            }
        });

        requestBtn.addEventListener('click', async () => {
            if (!hidDevice) return;

            // Reset tracking counters for the new request
            receivedBuffer = "";
            chunkCount = 0;
            packetCountEl.textContent = "0";
            jsonDisplay.textContent = "Waiting for response...";

            const encoder = new TextEncoder();
            const commandBytes = encoder.encode("GET_DATA");
            const buffer = new Uint8Array(64);
            buffer.set(commandBytes);

            await hidDevice.sendReport(0, buffer);
            console.log("Requested data from device...");
        });

        async function sendData(string){
            if (!hidDevice) return;

            // Reset tracking counters for the new request
            receivedBuffer = "";
            chunkCount = 0;
            packetCountEl.textContent = "0";
            jsonDisplay.textContent = "Waiting for response...";

            const encoder = new TextEncoder();
            const commandBytes = encoder.encode(string);
            const buffer = new Uint8Array(64);
            buffer.set(commandBytes);

            await hidDevice.sendReport(0, buffer);
            console.log("Requested data from device...");
        }
    </script>
</body>
</html>
